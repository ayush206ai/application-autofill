<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Sample Project Application</title>
<style>
body { font: 16px system-ui; max-width: 560px; margin: 40px auto; padding: 0 16px; }
label { display: block; margin: 12px 0; }
input, textarea { display: block; width: 100%; padding: 6px; font: inherit; box-sizing: border-box; }
</style>
<h1>Sample project application</h1>
<p>Use this practice form to try the extension. Use fictional profile details.</p>
<label>First name <input></label>
<label>Last name <input></label>
<label>Email address <input type="email"></label>
<label>GitHub username <input></label>
<label>Repository URL <input type="url"></label>
<label>Link to your work <input type="url"></label>
<label>Project description <textarea rows="4"></textarea></label>
<label>How many projects use your tool? <input type="number"></label>
</html>
